spring.application.name=sentinelflow
server.port=${PORT:8081}
spring.jackson.serialization.write-dates-as-timestamps=false
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sentinelflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sentinelflow_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:local-sentinelflow-change-me}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.flyway.enabled=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6381}
spring.data.redis.password=${REDIS_PASSWORD:local-only-change-me}
spring.cache.type=redis
spring.cache.redis.time-to-live=PT30S
spring.cache.redis.use-key-prefix=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
security.users.admin.username=${ADMIN_USERNAME:admin}
security.users.admin.password=${ADMIN_PASSWORD:local-admin-change-me}
security.users.analyst.username=${ANALYST_USERNAME:analyst}
security.users.analyst.password=${ANALYST_PASSWORD:local-analyst-change-me}
security.users.viewer.username=${VIEWER_USERNAME:viewer}
security.users.viewer.password=${VIEWER_PASSWORD:local-viewer-change-me}